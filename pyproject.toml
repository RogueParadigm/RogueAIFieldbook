[project]
name = "rogue-ai-fieldbook"
version = "0.1.0"
description = "Reusable, evidence-backed primitives for Rogue Paradigm local-AI workflows"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

